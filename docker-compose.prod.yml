version: '3.8'

services:
  tiktok-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - exports:/app/exports
      - logs:/app/logs
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - OUTPUT_DIR=exports
      - LOGS_DIR=logs
      - MS_TOKEN=${MS_TOKEN}
      - HEADLESS=True
      - MAX_COMMENTS=500
      - TIMEOUT=60
      - RETRIES=3
    command: python -m uvicorn app:app --host 0.0.0.0 --port 5000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tiktok-network

volumes:
  exports:
    driver: local
  logs:
    driver: local

networks:
  tiktok-network:
    driver: bridge
