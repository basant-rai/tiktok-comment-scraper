<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Comment Scraper</title>
    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #161b26;
            --bg-input: #1f2635;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-tiktok: #fe2c55;
            --accent-cyan: #25f4ee;
            --accent-purple: #7928ca;
            --success: #10b981;
            --error: #ef4444;
            --border: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* Header Style */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8em;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-tiktok));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        /* Dashboard Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card Component */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(37, 244, 238, 0.15);
        }

        .validation-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            font-size: 1.2em;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-tiktok), var(--accent-purple));
            color: white;
            flex: 2;
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(254, 44, 85, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #2a3447;
            color: white;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #36435c;
        }

        /* Feedback Messages */
        .error-message,
        .success-message,
        .url-status {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.95em;
            display: none;
            font-weight: 500;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .url-status {
            margin-top: 10px;
            margin-bottom: 0;
        }

        .url-status.valid {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            display: block;
        }

        .url-status.invalid {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            display: block;
        }

        /* Loading Spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .spinner {
            border: 4px solid var(--bg-input);
            border-top: 4px solid var(--accent-cyan);
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        #loadingStatus {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 5px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Results & Dashboard Layout */
        .results-pane {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .results {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: var(--bg-input);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-2px);
        }

        .stat-box .label {
            font-size: 0.85em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-box .value {
            font-size: 1.8em;
            font-weight: 800;
            color: #fff;
        }

        /* File List Styles */
        .file-list {
            max-height: 240px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .file-item {
            background: var(--bg-input);
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item .name {
            font-weight: 600;
            color: #fff;
            font-size: 0.95em;
            margin-bottom: 3px;
        }

        .file-item .size {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .file-item button {
            padding: 8px 14px;
            font-size: 0.85em;
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎵 TikTok Comment Scraper</h1>
            <p>Extract and analyze audience insights effortlessly</p>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-title">⚙️ Configuration</div>
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <form id="scraperForm">
                    <div class="form-group">
                        <label for="videoUrl">TikTok Video URL</label>
                        <div class="input-wrapper">
                            <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/@username/video/..."
                                required />
                            <span class="validation-icon" id="validationIcon"></span>
                        </div>
                        <div class="url-status" id="urlStatus"></div>
                    </div>

                    <div class="form-group">
                        <label for="maxComments">Maximum Target Comments</label>
                        <input type="number" id="maxComments" min="1" max="10000" value="200" required />
                    </div>

                    <div class="form-group">
                        <label for="exportFormat">Preferred Export Format</label>
                        <select id="exportFormat" required>
                            <option value="json">JSON (Structured Data)</option>
                            <option value="csv">CSV (Spreadsheet/Excel)</option>
                            <option value="excel">Excel Dashboard (XLSX)</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary" id="scrapeBtn">
                            Start Extracting
                        </button>
                        <button type="reset" class="btn-secondary">
                            Clear
                        </button>
                    </div>
                </form>
            </div>

            <div class="results-pane">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <h3>Scraping Active</h3>
                    <p id="loadingStatus">Initializing crawler hooks...</p>
                </div>

                <div class="results" id="results">
                    <div class="card" style="margin-bottom: 24px;">
                        <div class="card-title">📊 Analytics Overview</div>
                        <div class="stats-grid" id="statsGrid"></div>

                        <div id="exportSection"
                            style="margin-top: 25px; border-top: 1px solid var(--border); padding-top: 20px;">
                            <button type="button" class="btn-primary" id="downloadBtn" style="width: 100%;">
                                📥 Download Captured Data
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">📂 Capture History</div>
                    <div class="file-list" id="fileList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById("scraperForm");
        const videoUrlInput = document.getElementById("videoUrl");
        const maxCommentsInput = document.getElementById("maxComments");
        const exportFormatSelect = document.getElementById("exportFormat");
        const scrapeBtn = document.getElementById("scrapeBtn");
        const loading = document.getElementById("loading");
        const results = document.getElementById("results");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");
        const urlStatus = document.getElementById("urlStatus");
        const validationIcon = document.getElementById("validationIcon");
        const statsGrid = document.getElementById("statsGrid");
        const downloadBtn = document.getElementById("downloadBtn");
        const fileList = document.getElementById("fileList");
        let lastExportFile = null;

        videoUrlInput.addEventListener("blur", validateUrl);
        videoUrlInput.addEventListener("input", validateUrl);

        async function validateUrl() {
            const url = videoUrlInput.value.trim();
            if (!url) {
                urlStatus.classList.remove("valid", "invalid");
                validationIcon.textContent = "";
                return;
            }

            try {
                const response = await fetch("/api/validate-url", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.valid) {
                    urlStatus.classList.remove("invalid");
                    urlStatus.classList.add("valid");
                    urlStatus.textContent = "✓ " + data.message;
                    validationIcon.textContent = "✓";
                    validationIcon.style.color = var(--success);
                } else {
                    urlStatus.classList.remove("valid");
                    urlStatus.classList.add("invalid");
                    urlStatus.textContent = "✗ " + data.message;
                    validationIcon.textContent = "✗";
                    validationIcon.style.color = var(--error);
                }
            } catch (error) {
                console.error("Validation error:", error);
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            await scrapeComments();
        });

        async function scrapeComments() {
            const url = videoUrlInput.value.trim();
            const maxComments = parseInt(maxCommentsInput.value);
            const exportFormat = exportFormatSelect.value;

            if (!url) {
                showError("Please enter a TikTok video URL");
                return;
            }

            scrapeBtn.disabled = true;
            loading.style.display = "block";
            results.style.display = "none";
            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            try {
                const response = await fetch("/api/scrape", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        video_url: url,
                        max_comments: maxComments,
                        export_format: exportFormat
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    lastExportFile = data.export_file;
                    displayResults(data);
                    loadExports();
                    showSuccess(`Successfully scraped ${data.total_comments} comments!`);
                } else {
                    showError(data.error || "Failed to scrape comments");
                }
            } catch (error) {
                showError("Error: " + error.message);
            } finally {
                scrapeBtn.disabled = false;
                loading.style.display = "none";
            }
        }

        function displayResults(data) {
            const { summary, metadata } = data;

            statsGrid.innerHTML = `
                <div class="stat-box">
                    <div class="label">Total Comments</div>
                    <div class="value">${summary.total_comments}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Total Likes</div>
                    <div class="value">${summary.total_likes}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Total Replies</div>
                    <div class="value">${summary.total_replies}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Avg Likes</div>
                    <div class="value">${summary.avg_likes.toFixed(1)}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Avg Replies</div>
                    <div class="value">${summary.avg_replies.toFixed(1)}</div>
                </div>
                <div class="stat-box">
                    <div class="label">Verified Users</div>
                    <div class="value">${summary.verified_users}</div>
                </div>
            `;

            results.style.display = "block";
        }

        downloadBtn.addEventListener("click", () => {
            if (lastExportFile) {
                window.location.href = `/api/download/${lastExportFile}`;
            }
        });

        async function loadExports() {
            try {
                const response = await fetch("/api/exports");
                const data = await response.json();

                fileList.innerHTML = data.files.map(file => `
                    <div class="file-item">
                        <div class="info">
                            <div class="name">${file.name}</div>
                            <div class="size">${formatFileSize(file.size)}</div>
                        </div>
                        <button type="button" class="btn-secondary" onclick="downloadFile('${file.name}')">
                            Download
                        </button>
                    </div>
                `).join("");
            } catch (error) {
                console.error("Error loading exports:", error);
            }
        }

        function downloadFile(filename) {
            window.location.href = `/api/download/${filename}`;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return "0 Bytes";
            const k = 1024;
            const sizes = ["Bytes", "KB", "MB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + " " + sizes[i];
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = "block";
            setTimeout(() => {
                successMessage.style.display = "none";
            }, 5000);
        }

        loadExports();
    </script>
</body>

</html>
